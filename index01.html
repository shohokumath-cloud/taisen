<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALS バトルプレイヤー</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // グローバル変数の宣言
        let db;
        let roomId = null;
        let playerId = null;
        let nickname = "";
        let questions = [];
        let qIdx = 0;
        let rule = "time";
        let initialStock = 3;
        let currentStock = 3;
        let correctCount = 0;
        let missCount = 0;
        let totalElapsedTime = 0;
        let questionStartTime = 0;
        
        let unsubscribeRoom = null;
        let isAggregating = false;
        
        let roomTimeLimit = 0;
        let studentTimerInterval = null;

        // 【改善】外部のJSONファイルからFirebase設定を動的に読み込む
        try {
            const response = await fetch('./mals-firebase-config.json');
            if (!response.ok) throw new Error("JSONファイルの読み込みに失敗しました");
            const firebaseConfig = await response.json();
            
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            
            console.log("Firebase initialized dynamically via JSON.");
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
            alert("データベース設定の読み込みに失敗しました。\nローカルサーバー（http://localhost...）で実行しているか確認してください。");
        }

        // MALS互換ユーティリティ
        function escapeHtmlPreservingText(text) { return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function parseFlexibleNumber(str) {
            if (str == null) return null;
            const s = String(str).trim();
            if (s.includes('/')) { const p = s.split('/'); const n = parseFloat(p[0]), d = parseFloat(p[1]); return (!isNaN(n) && !isNaN(d) && d !== 0) ? n / d : null; }
            const v = parseFloat(s); return isNaN(v) ? null : v;
        }
        function normalizeExpressionText(s) {
            return String(s).replace(/\s+/g, '').replace(/[²]/g, '^2').replace(/[³]/g, '^3')
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).toLowerCase();
        }

        window.joinRoom = async function() {
            if (!db) { alert("データベースに接続されていません。"); return; }
            const roomInput = document.getElementById("room-id-input").value.trim();
            const nameInput = document.getElementById("nickname-input").value.trim();
            const btn = document.getElementById("join-btn");

            if (!roomInput || !nameInput) { alert("ルームIDとニックネームを入力してください。"); return; }
            btn.disabled = true; btn.innerText = "入室処理中...";

            try {
                const roomSnap = await getDoc(doc(db, "rooms", roomInput));
                if (!roomSnap.exists() || roomSnap.data().status !== "waiting") {
                    alert("部屋が見つからないか、既に対戦が始まっています。");
                    btn.disabled = false; btn.innerText = "対戦部屋に入る"; return;
                }

                const roomData = roomSnap.data();
                roomId = roomInput;
                nickname = nameInput;
                questions = roomData.questions;
                rule = roomData.gameRule;
                initialStock = roomData.initialStock;
                currentStock = roomData.initialStock;
                playerId = Math.random().toString(36).substring(2, 10);

                await setDoc(doc(db, "rooms", roomId, "players", playerId), {
                    playerId, nickname, correct: 0, miss: 0, stock: currentStock, elapsedTime: 0, currentQIdx: 0, isFinished: false
                });

                document.getElementById("screen-login").classList.remove("active");
                document.getElementById("screen-wait").classList.add("active");
                listenRoomStatus();

            } catch (e) {
                console.error(e); alert("接続に失敗しました。");
                btn.disabled = false; btn.innerText = "対戦部屋に入る";
            }
        };

        function listenRoomStatus() {
            unsubscribeRoom = onSnapshot(doc(db, "rooms", roomId), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                
                if (data.status === "playing" && !document.getElementById('screen-game').classList.contains('active') && !document.getElementById('screen-countdown').classList.contains('active')) {
                    roomTimeLimit = data.timeLimit || 0;
                    startCountdown();
                } 
                else if (data.status === "finished") {
                    if (!isAggregating && !document.getElementById('screen-finish').classList.contains('active')) {
                        isAggregating = true;
                        endGamePlay();
                    }
                }
            });
        }

        function startCountdown() {
            document.getElementById("screen-wait").classList.remove("active");
            document.getElementById("screen-countdown").classList.add("active");
            
            const cdEl = document.getElementById("countdown-number");
            let count = 3; cdEl.innerText = count;
            
            const interval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(interval);
                    document.getElementById("screen-countdown").classList.remove("active");
                    document.getElementById("screen-game").classList.add("active");
                    initGamePlay();
                } else { cdEl.innerText = count; }
            }, 1000);
        }

        function initGamePlay() {
            qIdx = 0; correctCount = 0; missCount = 0; totalElapsedTime = 0; isAggregating = false;
            document.getElementById("status-label").innerText = rule === 'stock' ? "残機" : "正解";
            document.getElementById("status-display").innerText = rule === 'stock' ? "★".repeat(initialStock) : "0 問";
            startStudentTimer(roomTimeLimit);
            loadQuestion();
        }
        
        function startStudentTimer(timeLimit) {
            const timerEl = document.getElementById('student-timer-display');
            if (timeLimit === 0) { 
                const startTime = Date.now();
                studentTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    timerEl.innerText = `${String(Math.floor(elapsed / 60)).padStart(2,'0')}:${String(elapsed % 60).padStart(2,'0')}`;
                }, 1000);
                return;
            }
            
            const endTime = Date.now() + (timeLimit * 1000);
            studentTimerInterval = setInterval(() => {
                const left = Math.ceil((endTime - Date.now()) / 1000);
                if (left <= 0) {
                    clearInterval(studentTimerInterval);
                    timerEl.innerText = "00:00";
                    if (!isAggregating) { isAggregating = true; endGamePlay(); }
                } else {
                    timerEl.innerText = `${String(Math.floor(left / 60)).padStart(2,'0')}:${String(left % 60).padStart(2,'0')}`;
                    if (left <= 10) timerEl.style.color = "var(--error)";
                }
            }, 200);
        }

        function loadQuestion() {
            if (isAggregating) return;
            const q = questions[qIdx];
            const area = document.getElementById("question-area");
            area.innerHTML = '';

            document.getElementById("game-info").innerText = `${qIdx + 1} /${questions.length}問`;

            const questionDiv = document.createElement("div");
            questionDiv.innerHTML = escapeHtmlPreservingText(q.question);
            questionDiv.style.marginBottom = "20px";
            questionDiv.style.width = "100%";
            questionDiv.style.fontSize = "1.2rem";
            area.appendChild(questionDiv);

            const inputArea = document.createElement("div");
            inputArea.style.width = "100%";
            
            if (q.type === 'numeric' || q.type === 'expression') {
                inputArea.innerHTML = `<input type="text" id="user-input-field" class="text-input" placeholder="ここに入力して解答" style="text-align:center;">`;
            } else {
                let choicesHtml = '<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">';
                (q.choices || []).forEach((choice, idx) => {
                    choicesHtml += `<button onclick="checkChoiceAnswer(${idx})" class="btn-main btn-next" style="padding:15px; font-size:1.1rem;">${escapeHtmlPreservingText(choice)}</button>`;
                });
                choicesHtml += '</div>';
                inputArea.innerHTML = choicesHtml;
            }
            area.appendChild(inputArea);

            if (window.renderMathInElement) {
                window.renderMathInElement(area, {
                    delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}],
                    throwOnError: false
                });
            }

            document.getElementById("result-text").innerText = '';
            
            const ansBtn = document.getElementById("ans-btn");
            if (q.type === 'choice' || !q.type) {
                ansBtn.style.display = "none";
            } else {
                ansBtn.style.display = "block";
                ansBtn.disabled = false;
            }
            document.getElementById("next-btn").disabled = true;
            questionStartTime = performance.now();
        }

        window.checkChoiceAnswer = function(selectedIndex) {
            if (isAggregating) return;
            const q = questions[qIdx];
            finalizeAnswer((selectedIndex === q.correct), q.choices[q.correct]);
        };

        window.checkTextInputAnswer = function() {
            if (isAggregating) return;
            const q = questions[qIdx];
            const inputField = document.getElementById('user-input-field');
            if (!inputField) return;
            
            const rawInput = inputField.value.trim();
            if (!rawInput) { alert("解答を入力してください。"); return; }

            let isCorrect = false, correctDisplay = "";
            if (q.type === 'numeric') {
                const sVal = parseFlexibleNumber(rawInput), cVal = parseFlexibleNumber(q.numericAnswer);
                if (sVal !== null && cVal !== null) { isCorrect = Math.abs(sVal - cVal) <= (q.numericTolerance || 1e-9); }
                correctDisplay = q.numericAnswer;
            } else if (q.type === 'expression') {
                const normInput = normalizeExpressionText(rawInput);
                const accepted = q.acceptedExpressions || [];
                isCorrect = accepted.some(a => normalizeExpressionText(a) === normInput);
                correctDisplay = accepted[0] || "";
            }
            finalizeAnswer(isCorrect, correctDisplay);
        };

        async function finalizeAnswer(isCorrect, correctDisplay) {
            totalElapsedTime += (performance.now() - questionStartTime);

            if (isCorrect) {
                correctCount++;
                document.getElementById("result-text").innerHTML = '<span class="text-success">〇 正解！</span>';
            } else {
                missCount++;
                document.getElementById("result-text").innerHTML = `<span class="text-error">× 不正解...</span> <span class="correct-hint">(正解: ${escapeHtmlPreservingText(correctDisplay)})</span>`;
                if (rule === 'stock') currentStock--;
            }

            document.getElementById("status-display").innerText = rule === 'stock' ? (currentStock > 0 ? "★".repeat(currentStock) : "✕ 脱落") : `${correctCount} 問`;
            document.getElementById("ans-btn").disabled = true;
            document.getElementById("next-btn").disabled = false;

            if (window.renderMathInElement) window.renderMathInElement(document.getElementById("result-text"), { delimiters: [{left: "$", right: "$", display: false}] });

            try {
                await updateDoc(doc(db, "rooms", roomId, "players", playerId), {
                    correct: correctCount, miss: missCount, stock: currentStock, elapsedTime: totalElapsedTime,
                    currentQIdx: qIdx + 1, isFinished: (qIdx + 1 >= questions.length || (rule === 'stock' && currentStock <= 0))
                });
            } catch (e) { console.error(e); }

            if (rule === 'stock' && currentStock <= 0) {
                isAggregating = true;
                setTimeout(() => { endGamePlay(); }, 2000);
            }
        }

        window.nextQuestion = function() {
            if (isAggregating) return;
            qIdx++;
            if (qIdx >= questions.length) { isAggregating = true; endGamePlay(); }
            else loadQuestion();
        };

        function endGamePlay() {
            if (studentTimerInterval) clearInterval(studentTimerInterval);
            
            updateDoc(doc(db, "rooms", roomId, "players", playerId), {
                isFinished: true, correct: correctCount, miss: missCount, elapsedTime: totalElapsedTime
            }).catch(e => console.error(e));

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-finish').classList.add('active');
            document.getElementById("res-score").innerText = rule === 'stock' ? `${currentStock} /${initialStock}` : `${correctCount} 問`;
            document.getElementById("res-miss").innerText = `${missCount} 回`;
            document.getElementById("res-time").innerText = `${(totalElapsedTime / 1000).toFixed(2)} 秒`;
        }

        window.quitEarly = function() {
            if(confirm("本当に対戦を終了してロビーに戻りますか？")) location.reload();
        };
    </script>
    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #212529; --border: #dee2e6; --accent: #495057; --p1-color: #0d6efd; --success: #198754; --error: #dc3545; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .app-container { width: 100%; max-width: 720px; background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); box-sizing: border-box; }
        .screen { display: none; } .screen.active { display: block; }
        h2 { text-align: center; color: var(--accent); margin-bottom: 25px; font-weight: 700; }
        .input-group { margin: 20px 0; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--accent); }
        .text-input { width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid var(--border); border-radius: 8px; box-sizing: border-box; outline: none; }
        .text-input:focus { border-color: var(--p1-color); }
        .btn-main { width: 100%; padding: 14px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; box-sizing: border-box; }
        .btn-ans { background: var(--p1-color); color: #fff; }
        .btn-ans:hover:not(:disabled) { background-color: #0b5ed7; }
        .btn-ans:disabled { background: var(--border); color: #adb5bd; cursor: not-allowed; display:none; }
        .btn-next { background: #e9ecef; color: var(--text-main); border: 1px solid var(--border); }
        .btn-next:hover:not(:disabled) { background: #dee2e6; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #6c757d; font-size: 0.95rem; font-weight: 600; }
        .status-badge-box { background: #f1f3f5; padding: 6px 12px; border-radius: 6px; color: var(--text-main); font-weight: 700; }
        .timer-badge { background: #fff3cd; color: #856404; padding: 4px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid #ffeeba; }
        
        .question-box { font-size: 1.1rem; padding: 25px; background: #f1f3f5; border-radius: 10px; text-align: center; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        #result-text { text-align: center; font-weight: bold; font-size: 1.25rem; min-height: 28px; margin-bottom: 15px; }
        .text-success { color: var(--success); } .text-error { color: var(--error); }
        .correct-hint { display: block; font-size: 0.95rem; color: #6c757d; font-weight: normal; margin-top: 4px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--p1-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stat-list { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 20px 0; text-align: left; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e9ecef; font-size: 1.1rem; }
        .stat-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="screen-login" class="screen active">
        <h2>MALS バトル</h2>
        <div class="input-group">
            <label>ルームID（4桁の数字）</label>
            <input type="number" id="room-id-input" class="text-input" placeholder="先生の画面の数字を入力">
        </div>
        <div class="input-group">
            <label>あなたのニックネーム</label>
            <input type="text" id="nickname-input" class="text-input" placeholder="例：たろう、ひろと" maxlength="12">
        </div>
        <button id="join-btn" class="btn-main btn-ans" onclick="joinRoom()">対戦部屋に入る</button>
    </div>

    <div id="screen-wait" class="screen" style="text-align: center; padding: 20px 0;">
        <h2>入室完了！</h2>
        <p style="color:#6c757d;">先生がスタートするまでお待ちください...</p>
        <div class="loader"></div>
    </div>

    <div id="screen-countdown" class="screen" style="text-align: center; padding: 40px 0;">
        <h2 style="font-size: 2rem; color: var(--p1-color);">まもなくスタート！</h2>
        <div id="countdown-number" style="font-size: 7rem; font-weight: 800; color: var(--accent); margin: 20px 0;">3</div>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-header">
            <div id="game-info">- / -問</div>
            
            <div class="timer-badge">
                <span>⏱</span>
                <span id="student-timer-display" style="font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums;">--:--</span>
            </div>

            <div class="status-badge-box">
                <span id="status-label" style="font-size:0.8rem; color:#6c757d; margin-right:6px;">-</span>
                <span id="status-display">-</span>
            </div>
        </div>
        
        <div class="question-box" id="question-area"></div>
        <div id="result-text"></div>
        
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <button id="ans-btn" class="btn-main btn-ans" onclick="checkTextInputAnswer()">解答する</button>
            <button id="next-btn" class="btn-main btn-next" onclick="nextQuestion()" disabled>次に進む</button>
        </div>
        
        <div style="text-align: center; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
            <button class="btn-main" style="background: none; color: #adb5bd; border: 1px solid #ced4da; padding: 8px; font-size: 0.9rem; width: auto;" onclick="quitEarly()">ゲームを途中で退出する</button>
        </div>
    </div>

    <div id="screen-finish" class="screen" style="text-align: center;">
        <h2 style="color:var(--success);">FINISH!!</h2>
        <p style="color:#6c757d;">全ての解答が送信されました！<br>最終順位は前方のプロジェクターを確認してください。</p>
        <div class="stat-list">
            <div class="stat-row"><span>あなたの成績</span><span id="res-score">-</span></div>
            <div class="stat-row"><span>ミスの回数</span><span id="res-miss">-</span></div>
            <div class="stat-row"><span>合計解答時間</span><span id="res-time">-</span></div>
        </div>
        <button class="btn-main btn-next" style="margin-top:25px;" onclick="location.reload()">ロビーに戻る</button>
    </div>
</div>
</body>
</html>
