<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALS バトルホスト（教員用管理画面）</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // グローバル変数の宣言
        let db, rtdb;
        let currentRoomId = null;
        let unsubscribePlayers = null;
        let playersData = {};
        let hostTimerInterval = null;

        // 【改善】外部のJSONファイルからFirebase設定を動的に読み込む
        try {
            const response = await fetch('./firebase-config.json');
            if (!response.ok) throw new Error("JSONファイルの読み込みに失敗しました");
            const firebaseConfig = await response.json();
            
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            rtdb = getDatabase(app);
            
            console.log("Firebase initialized dynamically via JSON.");
        } catch (error) {
            console.error("Firebase Initialization Error:", error);
            alert("データベース設定の読み込みに失敗しました。\nローカルサーバー（http://localhost...）で実行しているか確認してください。");
        }

        window.onload = async () => {
            if (!rtdb) return; // DB初期化失敗時はスキップ
            const classSelect = document.getElementById('mals-class-select');
            try {
                const snap = await get(ref(rtdb, 'mals_v6_system/classes'));
                if (snap.exists()) {
                    const classes = snap.val();
                    classSelect.innerHTML = '<option value="">-- クラスを選択 --</option>';
                    Object.values(classes).filter(c => !c.archived).forEach(c => {
                        classSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    });
                } else {
                    classSelect.innerHTML = '<option value="">MALSにクラスが存在しません</option>';
                }
            } catch (e) {
                console.error(e);
                alert("MALSデータの読み込みに失敗しました。");
            }
        };

        window.loadCategories = async function() {
            const classId = document.getElementById('mals-class-select').value;
            const catSelect = document.getElementById('mals-category-select');
            catSelect.innerHTML = '<option value="">-- 読み込み中... --</option>';

            if (!classId) {
                catSelect.innerHTML = '<option value="">先にクラスを選択してください</option>';
                return;
            }

            try {
                const snap = await get(ref(rtdb, `mals_v6_system/classData/${classId}/categories`));
                if (snap.exists()) {
                    const categories = snap.val();
                    catSelect.innerHTML = '<option value="">-- 対戦する単元を選択 --</option>';
                    Object.values(categories).filter(c => c.parentId !== 'root' && !c.archived).forEach(c => {
                        catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    });
                } else {
                    catSelect.innerHTML = '<option value="">単元が見つかりません</option>';
                }
            } catch (e) {
                console.error(e);
                catSelect.innerHTML = '<option value="">エラーが発生しました</option>';
            }
        };

        window.createRoom = async function() {
            const classId = document.getElementById('mals-class-select').value;
            const categoryId = document.getElementById('mals-category-select').value;
            const rule = document.getElementById('game-rule').value;
            const btn = document.getElementById('create-btn');

            if (!classId || !categoryId) { alert("クラスと単元を選択してください。"); return; }

            btn.disabled = true; btn.innerText = "作成中...";

            try {
                const snap = await get(ref(rtdb, `mals_v6_system/classData/${classId}/problems`));
                if (!snap.exists()) {
                    alert("このクラスには問題が登録されていません。");
                    btn.disabled = false; return;
                }

                const allProblems = snap.val();
                let selectedQuestions = Object.values(allProblems)
                    .filter(p => p.categoryId === categoryId)
                    .map(p => ({
                        type: p.type || 'choice',
                        question: p.question,
                        choices: p.choices || [],
                        correct: p.correct || 0,
                        numericAnswer: p.numericAnswer || null,
                        numericTolerance: p.numericTolerance || 0,
                        acceptedExpressions: p.acceptedExpressions || []
                    }));

                if (selectedQuestions.length === 0) {
                    alert("選択した単元に問題がありません。");
                    btn.disabled = false; btn.innerText = "対戦部屋を作る"; return;
                }

                selectedQuestions.sort(() => Math.random() - 0.5);
                currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();

                await setDoc(doc(db, "rooms", currentRoomId), {
                    status: "waiting",
                    gameRule: rule,
                    initialStock: 3,
                    questions: selectedQuestions,
                    createdAt: Date.now()
                });

                document.getElementById('screen-setup').classList.remove('active');
                document.getElementById('screen-lobby').classList.add('active');
                document.getElementById('display-room-id').innerText = currentRoomId;
                document.getElementById('q-count-label').innerText = `出題数: ${selectedQuestions.length}問`;

                listenPlayers();
            } catch (e) {
                console.error(e);
                alert("部屋の作成に失敗しました。");
                btn.disabled = false; btn.innerText = "対戦部屋を作る";
            }
        };

        function listenPlayers() {
            const playersRef = collection(db, "rooms", currentRoomId, "players");
            unsubscribePlayers = onSnapshot(playersRef, (snapshot) => {
                playersData = {};
                snapshot.forEach(doc => { playersData[doc.id] = doc.data(); });
                renderPlayerList();
                renderLeaderboard();
            });
        }

        function renderPlayerList() {
            const list = document.getElementById('player-list');
            const players = Object.values(playersData);
            document.getElementById('player-count').innerText = `現在 ${players.length} 人が参加中`;
            
            if (players.length === 0) {
                list.innerHTML = '<p style="color:#6c757d;">生徒の入室を待っています...</p>';
                return;
            }
            list.innerHTML = players.map(p => `<div class="player-chip">${p.nickname}</div>`).join('');
        }

        window.startGame = async function() {
            if (Object.keys(playersData).length === 0) {
                if (!confirm("まだ誰も入室していませんが開始しますか？")) return;
            }
            try {
                const timeLimit = parseInt(document.getElementById('time-limit').value, 10);
                
                await updateDoc(doc(db, "rooms", currentRoomId), { 
                    status: "playing",
                    timeLimit: timeLimit
                });
                
                document.getElementById('screen-lobby').classList.remove('active');
                document.getElementById('screen-countdown').classList.add('active');
                
                let count = 3;
                document.getElementById('countdown-number').innerText = count;
                const iv = setInterval(() => {
                    count--;
                    if(count <= 0) {
                        clearInterval(iv);
                        document.getElementById('screen-countdown').classList.remove('active');
                        document.getElementById('screen-monitor').classList.add('active');
                        startHostTimer(timeLimit);
                    } else {
                        document.getElementById('countdown-number').innerText = count;
                    }
                }, 1000);

            } catch (e) {
                console.error(e);
                alert("開始に失敗しました。");
            }
        };

        function startHostTimer(timeLimit) {
            const timerEl = document.getElementById('host-timer');
            const labelEl = document.getElementById('host-timer-label');
            
            if (timeLimit === 0) {
                const startTime = Date.now();
                hostTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    timerEl.innerText = `${String(Math.floor(elapsed / 60)).padStart(2,'0')}:${String(elapsed % 60).padStart(2,'0')}`;
                }, 1000);
                return;
            }
            
            const endTime = Date.now() + (timeLimit * 1000);
            hostTimerInterval = setInterval(() => {
                const left = Math.ceil((endTime - Date.now()) / 1000);
                if (left <= 0) {
                    clearInterval(hostTimerInterval);
                    timerEl.innerText = "00:00";
                    timerEl.style.color = "var(--error)";
                    labelEl.innerText = "ゲーム終了！";
                    updateDoc(doc(db, "rooms", currentRoomId), { status: "finished" });
                } else {
                    timerEl.innerText = `${String(Math.floor(left / 60)).padStart(2,'0')}:${String(left % 60).padStart(2,'0')}`;
                    if (left <= 10) timerEl.style.color = "var(--error)";
                }
            }, 100);
        }

        function renderLeaderboard() {
            const board = document.getElementById('leaderboard');
            if (!board) return;
            
            const players = Object.values(playersData);
            players.sort((a, b) => b.correct - a.correct || a.elapsedTime - b.elapsedTime);

            board.innerHTML = players.map((p, index) => `
                <div class="leaderboard-row ${p.isFinished ? 'finished' : ''}">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span style="font-weight:bold; font-size:1.2rem; color:#6c757d;">${index + 1}</span>
                        <span style="font-weight:bold; font-size:1.1rem;">${p.nickname}</span>${p.isFinished ? '<span style="font-size:0.8rem; background:#0d6efd; color:#fff; padding:2px 6px; border-radius:4px;">終了</span>' : ''}
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold; color:#198754;">正解: ${p.correct} 問</div>
                        <div style="font-size:0.85rem; color:#6c757d;">ミス: ${p.miss} / タイム: ${(p.elapsedTime / 1000).toFixed(1)}秒</div>
                    </div>
                </div>
            `).join('');
        }

        window.resetHost = function() {
            if (confirm("対戦を終了して初期画面に戻りますか？")) location.reload();
        };
    </script>

    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #212529; --border: #dee2e6; --accent: #495057; --p1-color: #0d6efd; --error: #dc3545; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .app-container { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); box-sizing: border-box; }
        .screen { display: none; }
        .screen.active { display: block; }
        h2 { text-align: center; color: var(--accent); margin-bottom: 25px; font-weight: 700; }
        .input-group { margin: 20px 0; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--accent); font-size: 0.9rem; }
        select, .text-input { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid var(--border); border-radius: 8px; box-sizing: border-box; outline: none; background: #fff; }
        select:focus, .text-input:focus { border-color: var(--p1-color); }
        .btn-main { width: 100%; padding: 14px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; box-sizing: border-box; color: #fff; background: var(--p1-color); }
        .btn-main:hover:not(:disabled) { background: #0b5ed7; }
        .btn-main:disabled { background: var(--border); cursor: not-allowed; }
        .room-id-display { font-size: 5rem; font-weight: 800; text-align: center; letter-spacing: 5px; color: var(--text-main); margin: 10px 0; }
        .player-chip { display: inline-block; padding: 8px 16px; background: #e7f5ff; border: 1px solid #74c0fc; color: #1864ab; border-radius: 20px; font-weight: 600; margin: 5px; }
        .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); }
        .leaderboard-row.finished { background-color: #f1f3f5; }
        .host-timer-container { text-align: center; margin: 10px 0 25px 0; background: #f8f9fa; padding: 25px; border-radius: 12px; border: 2px solid var(--border); }
    </style>
</head>
<body>
<div class="app-container">
    <div id="screen-setup" class="screen active">
        <h2>対戦部屋の作成（ホスト）</h2>
        <div class="input-group">
            <label>MALS クラス選択</label>
            <select id="mals-class-select" onchange="loadCategories()">
                <option value="">-- 読み込み中... --</option>
            </select>
        </div>
        <div class="input-group">
            <label>出題する単元（小単元）</label>
            <select id="mals-category-select">
                <option value="">先にクラスを選択してください</option>
            </select>
        </div>
        <div class="input-group">
            <label>制限時間</label>
            <select id="time-limit">
                <option value="60">1分</option>
                <option value="180" selected>3分</option>
                <option value="300">5分</option>
                <option value="0">無制限（ストップウォッチ）</option>
            </select>
        </div>
        <div class="input-group">
            <label>ゲームルール</label>
            <select id="game-rule">
                <option value="time">タイムアタック（制限時間内で正解数を競う）</option>
                <option value="stock">サバイバル（3回ミスで脱落・残機制）</option>
            </select>
        </div>
        <button id="create-btn" class="btn-main" style="margin-top:20px;" onclick="createRoom()">この設定で部屋を作る</button>
    </div>

    <div id="screen-lobby" class="screen">
        <h2>参加者待ち</h2>
        <p style="text-align: center; color: #6c757d; margin-bottom:0;">生徒にこのルームIDを入力させてください</p>
        <div class="room-id-display" id="display-room-id">----</div>
        <p style="text-align: center; font-weight:bold; color:#0d6efd;" id="q-count-label">出題数: -問</p>
        
        <div style="margin: 30px 0; padding: 20px; background: #f8f9fa; border-radius: 8px; border: 1px solid var(--border); min-height:100px;">
            <p id="player-count" style="margin-top:0; font-weight:bold; color:var(--accent); font-size:0.9rem;">現在 0 人が参加中</p>
            <div id="player-list"></div>
        </div>
        
        <button class="btn-main" style="background:#198754;" onclick="startGame()">全員揃ったらゲーム開始！</button>
        <button class="btn-main" style="background:#6c757d; margin-top:10px;" onclick="resetHost()">やめる</button>
    </div>

    <div id="screen-countdown" class="screen" style="text-align: center; padding: 40px 0;">
        <h2 style="font-size: 2.5rem; color: var(--p1-color);">まもなくスタート！</h2>
        <div id="countdown-number" style="font-size: 8rem; font-weight: 800; color: var(--accent); margin: 20px 0;">3</div>
    </div>

    <div id="screen-monitor" class="screen">
        <div class="host-timer-container">
            <div id="host-timer-label" style="font-size: 1.4rem; color: var(--accent); font-weight: bold; margin-bottom: 5px;">残り時間</div>
            <div id="host-timer" style="font-size: 7rem; font-weight: 800; color: var(--text-main); font-variant-numeric: tabular-nums; line-height: 1;">--:--</div>
        </div>

        <h2>ライブランキング</h2>
        <div style="background: #fff; border: 1px solid var(--border); border-radius: 8px; max-height: 400px; overflow-y: auto;" id="leaderboard"></div>
        <button class="btn-main" style="background:#6c757d; margin-top:20px;" onclick="resetHost()">ゲームを終了して戻る</button>
    </div>
</div>
</body>
</html>
